<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BasePró - High Performance</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3182ce">
    <style>
        :root {
            --primary: #3182ce; 
            --dark: #0a0a0a;
            --card-bg: #1e1e1e;
            --light: #ffffff;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-container { width: 95%; max-width: 400px; padding: 20px 0; }

        header { text-align: center; width: 100%; margin-bottom: 25px; padding: 10px 0; }
        header h2 { font-style: italic; font-weight: 900; font-size: 1.4rem; margin: 0; text-transform: uppercase; }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            box-sizing: border-box;
            width: 100%;
        }

        .video-box {
            width: 100%;
            height: 190px;
            background: #000;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--primary);
        }

        input, select {
            width: 100%;
            padding: 18px;
            margin: 10px 0;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            background: #ffffff;
            color: #333;
            box-sizing: border-box;
            outline: none;
        }

        .btn-blue {
            width: 100%;
            padding: 18px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 5px 0px #225a8e;
            transition: 0.1s;
            margin-top: 10px;
        }

        .btn-blue:active { transform: translateY(3px); box-shadow: 0 2px 0px #225a8e; }

        .grid-medidas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .grid-medidas div { text-align: left; }
        .grid-medidas label { font-size: 0.7rem; color: var(--primary); font-weight: bold; text-transform: uppercase; }

        .hidden { display: none !important; }

        .timer { font-size: 3.5rem; font-weight: 800; margin: 15px 0; font-family: monospace; }
        .badge { background: var(--primary); padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: bold; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>

    <header>
        <h2>BASEPRÓ <span style="color:var(--primary)">PERFORMANCE</span></h2>
    </header>

    <div class="app-container">
        
        <div id="step-1" class="card">
            <div class="video-box"><span>VÍDEO BOAS-VINDAS</span></div>
            <input type="text" id="atletaNome" placeholder="Digite seu nome completo">
            <button class="btn-blue" onclick="irParaMetricas()">A EVOLUÇÃO COMEÇA AGORA</button>
        </div>

        <div id="step-metrics" class="card hidden">
            <h3 style="margin:0 0 15px 0;">SUA BIOMETRIA</h3>
            <div class="grid-medidas">
                <div><label>Peso (kg)</label><input type="number" id="peso" placeholder="00"></div>
                <div><label>Altura (m)</label><input type="number" id="altura" placeholder="1.75"></div>
                <div><label>Peito</label><input type="number" id="peito" placeholder="cm"></div>
                <div><label>Cintura</label><input type="number" id="cintura" placeholder="cm"></div>
                <div><label>Quadril</label><input type="number" id="quadril" placeholder="cm"></div>
                <div><label>Braço D.</label><input type="number" id="braco_d" placeholder="cm"></div>
                <div><label>Braço E.</label><input type="number" id="braco_e" placeholder="cm"></div>
                <div><label>Perna D.</label><input type="number" id="perna_d" placeholder="cm"></div>
                <div><label>Perna E.</label><input type="number" id="perna_e" placeholder="cm"></div>
            </div>
            <button class="btn-blue" onclick="salvarMetricas()">SALVAR E ENVIAR</button>
        </div>

        <div id="step-filter" class="card hidden">
            <h3 id="boas-vindas-txt">FOCO TOTAL!</h3>
            <select id="select-nivel">
                <option value="iniciante">INICIANTE</option>
                <option value="intermediario">INTERMEDIÁRIO</option>
                <option value="pro">PRO (BLACK & GOLD)</option>
            </select>
            <button class="btn-blue" onclick="iniciarTreino()">GERAR MEU TREINO</button>
            <p onclick="resetarTudo()" style="font-size:0.7rem; margin-top:20px; opacity:0.5; text-decoration:underline; cursor:pointer;">Atualizar Cadastro</p>
        </div>

        <div id="step-workout" class="card hidden">
            <div id="badge-nivel" class="badge">NÍVEL</div>
            <h2 id="ex-nome" style="margin: 10px 0;">EXERCÍCIO</h2>
            <div class="video-box"><span>VÍDEO EXECUÇÃO</span></div>
            
            <div style="display:flex; justify-content: space-around; background:rgba(255,255,255,0.05); padding:10px; border-radius:12px;">
                <div><small style="color:var(--primary)">PRESCRIÇÃO</small><br><strong id="ex-pres">3x 12</strong></div>
                <div><small style="color:var(--primary)">CARGA</small><br><input type="text" id="ex-carga" value="X" style="width:60px; background:transparent; color:white; border:none; border-bottom:1px solid var(--primary); text-align:center;"></div>
            </div>

            <div class="timer" id="timer-display">00:00</div>
            <button class="btn-blue" id="btn-timer" onclick="toggleTimer()">INICIAR SÉRIE</button>
            <button class="btn-blue" style="background:#fff; color:#000; box-shadow:0 5px 0px #ccc;" onclick="proximoEx()">CONCLUIR</button>
            <p onclick="voltarFiltro()" style="font-size:0.7rem; margin-top:15px; cursor:pointer; text-decoration:underline;">Mudar Intensidade</p>
        </div>
    </div>

<script>
    // --- LÓGICA DO APP ---
    const WHATS_COACH = "55XXXXXXXXXXX"; 
    let atleta = JSON.parse(localStorage.getItem('basepro_data')) || {};
    let treinoLista = [];
    let idxAtivo = 0;
    let tempoSeg = 0;
    let relogioObj;
    let rodando = false;

    const DATABASE = {
        iniciante: [{nome:"Mobilidade Tornozelo", pres:"2x 10 reps"}, {nome:"Agachamento Livre", pres:"3x 15 reps"}],
        intermediario: [{nome:"Spiderman Lunge", pres:"3x 10 reps"}, {nome:"Afundo", pres:"3x 12 reps"}],
        pro: [{nome:"Cossack Squat", pres:"3x 10 reps"}, {nome:"Pistol Squat", pres:"4x 6 reps"}]
    };

    window.onload = () => {
        if (atleta.nome && atleta.peso) {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-filter').classList.remove('hidden');
            document.getElementById('boas-vindas-txt').innerText = "FOCO TOTAL, " + atleta.nome.split(' ')[0] + "!";
        }
    };

    function irParaMetricas() {
        const n = document.getElementById('atletaNome').value;
        if(!n) return alert("Digite seu nome!");
        atleta.nome = n;
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('step-metrics').classList.remove('hidden');
    }

    function salvarMetricas() {
        const ids = ['peso', 'altura', 'peito', 'cintura', 'quadril', 'braco_d', 'braco_e', 'perna_d', 'perna_e'];
        let check = true;
        ids.forEach(id => {
            atleta[id] = document.getElementById(id).value;
            if(!atleta[id]) check = false;
        });
        if(!check) return alert("Preencha todas as medidas!");
        localStorage.setItem('basepro_data', JSON.stringify(atleta));
        enviarWhats();
        document.getElementById('step-metrics').classList.add('hidden');
        document.getElementById('step-filter').classList.remove('hidden');
    }

    function enviarWhats() {
        const imc = (atleta.peso / (atleta.altura * atleta.altura)).toFixed(2);
        const msg = `*ALUNO BASEPRÓ*%0A*Atleta:* ${atleta.nome}%0A*IMC:* ${imc}%0A*Peso:* ${atleta.peso}kg`;
        window.open(`https://api.whatsapp.com/send?phone=${WHATS_COACH}&text=${msg}`, '_blank');
    }

    function iniciarTreino() {
        const niv = document.getElementById('select-nivel').value;
        treinoLista = DATABASE[niv];
        idxAtivo = 0;
        document.getElementById('badge-nivel').innerText = niv.toUpperCase();
        document.getElementById('step-filter').classList.add('hidden');
        document.getElementById('step-workout').classList.remove('hidden');
        if(niv === 'iniciante') document.body.style.backgroundColor = "#004e89";
        else if(niv === 'intermediario') document.body.style.backgroundColor = "#c05800";
        else document.body.style.backgroundColor = "#000";
        mostrarEx();
    }

    function mostrarEx() {
        if(idxAtivo < treinoLista.length) {
            document.getElementById('ex-nome').innerText = treinoLista[idxAtivo].nome;
            document.getElementById('ex-pres').innerText = treinoLista[idxAtivo].pres;
            document.getElementById('ex-carga').value = "X";
            resetRelogio();
        } else {
            alert("TREINO CONCLUÍDO!");
            voltarFiltro();
        }
    }

    function proximoEx() { idxAtivo++; mostrarEx(); }

    function toggleTimer() {
        const b = document.getElementById('btn-timer');
        if(!rodando) {
            rodando = true; b.innerText = "PAUSAR";
            relogioObj = setInterval(() => {
                tempoSeg++;
                let m = Math.floor(tempoSeg/60).toString().padStart(2,'0');
                let s = (tempoSeg%60).toString().padStart(2,'0');
                document.getElementById('timer-display').innerText = m + ":" + s;
            }, 1000);
        } else {
            rodando = false; b.innerText = "RETOMAR";
            clearInterval(relogioObj);
        }
    }

    function resetRelogio() { clearInterval(relogioObj); tempoSeg = 0; rodando = false; document.getElementById('timer-display').innerText = "00:00"; document.getElementById('btn-timer').innerText = "INICIAR SÉRIE"; }

    function voltarFiltro() { document.getElementById('step-workout').classList.add('hidden'); document.getElementById('step-filter').classList.remove('hidden'); document.body.style.backgroundColor = "#0a0a0a"; }

    function resetarTudo() { localStorage.removeItem('basepro_data'); location.reload(); }

    // --- REGISTRO PWA ---
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
